[project]
name = "ghostcheck"
version = "0.1.0"
description = "Estimate whether a job posting is a ghost job, using only free signals"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ghostcheck = "ghostcheck.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostcheck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
